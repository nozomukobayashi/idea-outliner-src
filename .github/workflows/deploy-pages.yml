name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # 社内向けビルドでは、リポジトリの Variables に設定する（未設定なら github.com 向け）
          IDEA_OUTLINER_DEFAULT_HOST: ${{ vars.IDEA_OUTLINER_DEFAULT_HOST }}
          IDEA_OUTLINER_ALLOW_OTHER_HOSTS: ${{ vars.IDEA_OUTLINER_ALLOW_OTHER_HOSTS }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
